# Integration tests run against a throwaway in-memory database and build their
# own fixtures, so the demonstration seed must not run.
lms.seed.enabled=false

spring.datasource.url=jdbc:h2:mem:lmstest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=test-only-secret-key-that-is-long-enough-for-hmac-sha256-signing
app.jwt.expiration-ms=3600000
app.cors.allowed-origins=http://localhost:5173

logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.com.lms=WARN