server.port=8080

# ─── Database ────────────────────────────────────────────────────────────────
# File-backed H2 so seeded coursework, attendance and telemetry survive a
# restart. Delete ./data/lmsdb.mv.db to re-seed from scratch.
# Point spring.datasource.* at MySQL to move to a server database.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/lmsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:password}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── Uploads ─────────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
lms.upload.dir=uploads/snapshots/

# ─── Security ────────────────────────────────────────────────────────────────
# Override APP_JWT_SECRET in the environment before deploying anywhere real;
# the literal below exists only so a fresh clone runs without configuration.
app.jwt.secret=${APP_JWT_SECRET:9a2f8c4e7b1d3a5f8e0c2b4a6d9e1f3a5b7c9d0e2f4a6b8c0d2e4f6a8b0c2d4e}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Comma-separated list of origins allowed to call the API.
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173}

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.com.lms=DEBUG