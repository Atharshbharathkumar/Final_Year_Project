server.port=8080

# JPA & Database (H2 Database with MySQL compatibility for smooth local execution)
spring.datasource.url=jdbc:h2:mem:lmsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
lms.upload.dir=uploads/snapshots/

# JWT Security Settings
# The literal below is a DEVELOPMENT default only. It is committed in source and
# must be treated as public. Set the APP_JWT_SECRET environment variable to
# override it anywhere the app is reachable by anyone other than you.
app.jwt.secret=${APP_JWT_SECRET:9a2f8c4e7b1d3a5f8e0c2b4a6d9e1f3a5b7c9d0e2f4a6b8c0d2e4f6a8b0c2d4e}
app.jwt.expiration-ms=86400000

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.com.lms=DEBUG
